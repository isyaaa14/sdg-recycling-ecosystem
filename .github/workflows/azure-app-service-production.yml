name: Azure App Service - Production Backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/azure-app-service-production.yml"
  workflow_dispatch:

concurrency:
  group: production-backend
  cancel-in-progress: false

env:
  NODE_VERSION: "24.x"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run syntax checks
        working-directory: backend
        run: npm run lint

      - name: Run tests
        working-directory: backend
        run: npm test

      - name: Validate Prisma schema
        working-directory: backend
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder?schema=public
        run: npx prisma validate

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Stage deployment package
        shell: bash
        run: |
          mkdir deployment
          cp backend/package.json backend/package-lock.json deployment/
          cp -R backend/src backend/prisma deployment/

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: backend-production
          path: deployment
          if-no-files-found: error
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: backend-production
          path: deployment

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy backend
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: deployment
